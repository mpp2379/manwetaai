<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - LTX Video Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">LTX</div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to use the LTX Video Generator.</p>

    <a class="google-btn" href="/auth/google">Continue with Google</a>

    <div class="divider"><span>OR</span></div>

    <label for="phone">Mobile number</label>
    <input id="phone" type="tel" placeholder="+919876543210" autocomplete="tel">
    <button id="sendOtp" class="btn full">Send OTP</button>

    <div id="otpBox" class="hidden">
      <label for="otp">OTP</label>
      <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" autocomplete="one-time-code">
      <button id="verifyOtp" class="btn full">Verify & Continue</button>
    </div>

    <div id="message" class="auth-message"></div>
    <p class="muted small">For local testing, DEV_OTP_MODE=true returns the OTP on this page.</p>
  </div>
</div>
<script>
const message = document.getElementById('message');
const phone = document.getElementById('phone');
const otp = document.getElementById('otp');
const otpBox = document.getElementById('otpBox');

function showMessage(text, error=false) {
  message.textContent = text;
  message.className = 'auth-message ' + (error ? 'error' : '');
}

document.getElementById('sendOtp').onclick = async () => {
  showMessage('Sending OTP...');
  try {
    const r = await fetch('/auth/send-otp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone.value})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Unable to send OTP');
    otpBox.classList.remove('hidden');
    otp.value = data.dev_otp || '';
    showMessage(data.dev_otp ? `Development OTP: ${data.dev_otp}` : 'OTP sent to your mobile.');
  } catch(e) {
    showMessage(e.message, true);
  }
};

document.getElementById('verifyOtp').onclick = async () => {
  showMessage('Verifying OTP...');
  try {
    const r = await fetch('/auth/verify-otp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: phone.value, otp: otp.value})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Invalid OTP');
    window.location.href = '/';
  } catch(e) {
    showMessage(e.message, true);
  }
};
</script>
</body>
</html>
